<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Placeholder card image, 1200 by 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1116"/>
      <stop offset="55%" stop-color="#121722"/>
      <stop offset="100%" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#sheen)"/>

  <g transform="translate(600 340)" fill="none" stroke="#60a5fa" stroke-opacity="0.34" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-92" y="-70" width="184" height="140" rx="12"/>
    <circle cx="-38" cy="-24" r="16" stroke-opacity="0.26"/>
    <path d="M-92 40l58-52 42 38 30-26 54 46" stroke-opacity="0.26"/>
  </g>

  <text x="600" y="486" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" letter-spacing="7" fill="#60a5fa" fill-opacity="0.5">1200 × 750</text>
  <text x="600" y="524" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" letter-spacing="4" fill="#60a5fa" fill-opacity="0.26">REPLACE WITH YOUR IMAGE</text>

  <rect x="0.5" y="0.5" width="1199" height="749" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-width="1"/>
